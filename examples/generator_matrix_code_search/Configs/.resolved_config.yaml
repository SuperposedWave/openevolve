max_iterations: 120
checkpoint_interval: 10
log_level: INFO
random_seed: 123
language: python
file_suffix: .py
diff_based_evolution: true
max_code_length: 20000
llm_config_path: llm_config.yaml
prompt:
  system_message: "Current target:\n- n = 50\n- k = 20\n- d = 13\n- r = n - k = 30\n\
    \nYou are improving a deterministic Python scoring function for binary\nlinear-code\
    \ construction from the generator matrix\n\n  G = [I_k | p_1 p_2 ... p_r].\n\n\
    The fixed evaluator keeps message deficits for every non-zero message m\nwith\
    \ wt(m) < d:\n\n  deficit[m] = d - wt(m) - parity_hits(m)\n\nA candidate parity\
    \ column p covers m when dot(m,p)=1. The fixed skeleton\ncomputes coverage features,\
    \ ranks candidate columns, updates deficits, and\nverifies the exact minimum distance\
    \ from G. Your code only scores one\ncandidate parity column.\n\nThe fixed skeleton\
    \ also applies a hard feasibility check. After accepting a\ncolumn, if a message\
    \ would still need more future covers than there are\nremaining parity columns,\
    \ that candidate is rejected before priority() is\nused. In other words, priority()\
    \ ranks feasible candidates; it does not need\nto rescue candidates that already\
    \ make the target impossible.\n\nYour file provides this function:\n\n  priority(\n\
    \      column_mask,\n      n,\n      k,\n      d,\n      step,\n      column_weight,\n\
    \      covered_deficit_sum,\n      covered_critical_count,\n      uncovered_critical_count,\n\
    \      feasible_next_count,\n      min_row_weight_after,\n      max_row_weight_after,\n\
    \      avg_pair_balance_after,\n  )\n\nDynamic arguments:\n- step: number of parity\
    \ columns already selected\n- column_weight: Hamming weight of this k-bit parity\
    \ column\n- covered_deficit_sum: total currently positive deficit covered by this\
    \ column\n- covered_critical_count: urgent messages covered by this column\n-\
    \ uncovered_critical_count: urgent messages not covered by this column\n- feasible_next_count:\
    \ estimated number of next-step columns that would\n  satisfy the next hard feasibility\
    \ constraints after accepting this column\n- min_row_weight_after / max_row_weight_after:\
    \ row parity weights if accepted\n- avg_pair_balance_after: mean absolute row-weight\
    \ imbalance if accepted\n\nYou may change only the code inside:\n\n  # EVOLVE-BLOCK-START\n\
    \  ...\n  # EVOLVE-BLOCK-END\n\nHard rules:\n- keep a callable priority() function\n\
    - do not change code outside the EVOLVE-BLOCK\n- do not read or write files\n\
    - do not start processes\n- do not use networking\n- do not rely on stdout or\
    \ stdin\n- keep scoring deterministic and side-effect free\n- use only function\
    \ arguments and local arithmetic\n- return a finite numeric score\n\nUseful heuristic\
    \ ideas:\n- cover high total deficit, but avoid starving urgent messages\n- strongly\
    \ punish uncovered_critical_count late in the fill\n- prefer candidates with larger\
    \ feasible_next_count when coverage is similar\n- prefer column weights near k/2\
    \ unless a repair-like late phase needs bias\n- keep row weights balanced across\
    \ message coordinates\n- avoid coarse bucket scores; return fine-grained deterministic\
    \ scores\n- use column_mask-derived deterministic tie breakers for diversity"
  num_top_programs: 5
  num_diverse_programs: 3
  include_artifacts: false
  max_artifact_bytes: 12000
database:
  population_size: 36
  archive_size: 12
  num_islands: 6
  elite_selection_ratio: 0.2
  exploration_ratio: 0.45
  exploitation_ratio: 0.35
  feature_dimensions:
  - constructed_columns
  - coverage_progress
  feature_bins: 6
  migration_interval: 4
  migration_rate: 0.25
  similarity_threshold: 0.99
evaluator:
  timeout: 900
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 2
  use_llm_feedback: false
  enable_artifacts: true
early_stopping_patience: -1
convergence_threshold: 1.0
early_stopping_metric: combined_score
early_stopping_shutdown_mode: terminate
